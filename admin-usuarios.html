<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerenciar Usuários</title><style>
body{background:#0b1423;color:#eaf1fa;font:15px system-ui;margin:0}main{max-width:1000px;margin:auto;padding:24px}section{background:#17283b;padding:18px;border-radius:14px;margin:15px 0}input,select,button{font:inherit;padding:10px;border-radius:7px}input,select{background:#102439;color:white;border:1px solid #42607a}button{background:#5baaf7;border:0;cursor:pointer}table{border-collapse:collapse;width:100%}td,th{padding:10px;border-bottom:1px solid #3a536a;text-align:left}a{color:#a7d0ff}#app[hidden]{display:none}</style>
