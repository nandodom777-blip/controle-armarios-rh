<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redefinir senha · Controle de Armários RH</title><style>body{font:16px system-ui;background:#0b1423;color:#eaf1fa;display:grid;place-items:center;min-height:90vh}.card{background:#17283b;padding:30px;border-radius:16px;max-width:430px;width:85%}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;margin:10px 0}input{background:#0c2135;color:white;border:1px solid #456078}button{background:#5baaf7;border:0;cursor:pointer}</style><main class="card"><h1>Nova senha</h1><p id="msg">Verificando o link enviado por e-mail...</p><form id="f" hidden><label>Nova senha<input type="password" id="p" minlength="12" autocomplete="new-password" required></label><button>Salvar nova senha</button></form><a href="/login.html" style="color:#b2d7ff">Voltar ao login</a></main><script>const BASE="https://cfcqsmlqxwedjwkywjne.supabase.co",KEY="sb_publishable_k7fa0F3DiUt2oSxC80ekjg_QY4nrH_G";let access='';const msg=document.getElementById('msg'),f=document.getElementById('f');async function init(){try{const h=new URLSearchParams(location.hash.slice(1)),q=new URLSearchParams(location.search);if(h.get('access_token')){access=h.get('access_token')}else if(q.get('token_hash')){const r=await fetch(BASE+'/auth/v1/verify',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({token_hash:q.get('token_hash'),type:q.get('type')||'recovery'})});const v=await r.json();if(!r.ok)throw Error(v.msg||v.message||'Link inválido');access=v.access_token}else{throw Error('Abra o link mais recente do e-mail de recuperação.')}if(!access)throw Error('Sessão de recuperação inválida');history.replaceState(null,'',location.pathname);msg.textContent='Digite uma nova senha com pelo menos 12 caracteres.';f.hidden=false}catch(e){msg.textContent=e.message}}init();f.onsubmit=async e=>{e.preventDefault();const password=document.getElementById('p').value;const r=await fetch(BASE+'/auth/v1/user',{method:'PUT',headers:{apikey:KEY,Authorization:'Bearer '+access,'Content-Type':'application/json'},body:JSON.stringify({password})});if(r.ok){f.hidden=true;msg.textContent='Senha alterada. Volte ao login e entre com sua nova senha.';access=''}else{msg.textContent='Não foi possível alterar a senha. Solicite novo link de recuperação.'}}</script></html>
