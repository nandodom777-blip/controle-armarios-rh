<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar — Controle de Armários RH</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b1423;color:#eaf1fa;font:15px system-ui,Arial;display:grid;place-items:center;padding:20px}.card{width:min(430px,100%);background:#17283b;border:1px solid #344b63;border-radius:20px;padding:32px;box-shadow:0 20px 60px #0005}.logo{width:48px;height:48px;background:#5baaf7;color:#08192b;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:24px}h1{font-size:26px;margin-bottom:5px}p{color:#afc3d7;line-height:1.5}label{display:block;margin:16px 0 6px}input,button{font:inherit;border-radius:9px;padding:13px;width:100%}input{background:#0c2135;color:#fff;border:1px solid #456078}input:focus{outline:2px solid #5baaf7}button{border:0;background:#5baaf7;color:#061529;font-weight:700;cursor:pointer;margin-top:20px}button:disabled{opacity:.6;cursor:wait}.link{background:none;color:#b2d7ff;padding:6px;margin-top:10px}.message{min-height:20px}.error{color:#ffb3b3}.ok{color:#a3e5c3}.small{font-size:12px}.password{display:flex;align-items:center;gap:6px}.password input{flex:1;min-width:0}.password button{width:auto;margin:0;background:#2d4c66;color:#fff;padding:12px}</style></head><body><main class="card"><div class="logo">RH</div><h1>Controle de Armários</h1><p>Entre com sua conta autorizada para acessar o sistema.</p><form id="form"><label for="email">E-mail</label><input id="email" type="email" required autocomplete="username" placeholder="usuario@empresa.com.br"><label for="senha">Senha</label><div class="password"><input id="senha" type="password" minlength="8" required autocomplete="current-password" placeholder="Sua senha"><button type="button" id="visivel" aria-label="Mostrar senha">Mostrar</button></div><button id="entrar" type="submit">Entrar</button></form><button class="link" id="recuperar" type="button">Esqueci minha senha</button><p class="message" id="aviso" role="status"></p><p class="small">O administrador autoriza os perfis. Esta página não cria contas automaticamente.</p></main><script>
const BASE='https://cfcqsmlqxwedjwkywjne.supabase.co',KEY="sb_publishable_k7fa0F3DiUt2oSxC80ekjg_QY4nrH_G";
const el=id=>document.getElementById(id),aviso=(s,erro=false)=>{el('aviso').className='message '+(erro?'error':'ok');el('aviso').textContent=s};
el('visivel').onclick=()=>{const s=el('senha');s.type=s.type==='password'?'text':'password';el('visivel').textContent=s.type==='password'?'Mostrar':'Ocultar'};
el('form').onsubmit=async e=>{e.preventDefault();el('entrar').disabled=true;aviso('Verificando credenciais...');
try{const r=await fetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify({email:el('email').value.trim(),password:el('senha').value})});const data=await r.json();if(!r.ok||!data.access_token)throw Error('E-mail ou senha inválidos.');const profile=await fetch(BASE+'/rest/v1/rh_armarios_perfis?select=perfil,ativo',{headers:{apikey:KEY,Authorization:'Bearer '+data.access_token}});if(!profile.ok)throw Error('Não foi possível verificar sua permissão.');const rows=await profile.json();if(!rows[0]?.ativo)throw Error('Esta conta ainda não foi autorizada pelo administrador.');sessionStorage.setItem('rh_armarios_sessao',JSON.stringify({access_token:data.access_token,refresh_token:data.refresh_token,expires_at:Date.now()+data.expires_in*1000,perfil:rows[0].perfil}));aviso('Autenticado como '+rows[0].perfil+'. A integração com o painel está em preparação.');}catch(err){aviso(err.message,true)}finally{el('entrar').disabled=false}};
el('recuperar').onclick=async()=>{const email=el('email').value.trim();if(!email)return aviso('Digite seu e-mail antes de solicitar recuperação.',true);try{await fetch(BASE+'/auth/v1/recover',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify({email})});aviso('Se existir uma conta para esse e-mail, você receberá instruções de recuperação.')}catch{aviso('Não foi possível solicitar a recuperação.',true)}};
</script></body></html>
