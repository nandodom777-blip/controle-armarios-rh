<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro | Controle de Armários</title>
<style>body{background:#0b1423;color:#eaf1fa;font:15px system-ui;display:grid;place-items:center;min-height:100vh;margin:0;padding:18px}main{background:#17283b;border:1px solid #344b63;border-radius:15px;padding:28px;max-width:430px;width:100%;box-sizing:border-box}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;margin-top:7px;font:inherit}input{background:#102439;color:white;border:1px solid #456078}button{background:#5baaf7;border:0;font-weight:700;cursor:pointer}label{display:block;margin:14px 0}p{color:#b6c9d9;line-height:1.5}a{color:#b6d6ff}</style>
<main><h1>Ativar minha conta</h1><p>Peça ao administrador para autorizar seu e-mail. Depois crie sua senha e confirme o cadastro pela mensagem recebida.</p>
<form id="f"><label>E-mail autorizado<input id="email" type="email" autocomplete="email" required></label><label>Senha (12 caracteres ou mais)<input id="password" type="password" minlength="12" autocomplete="new-password" required></label><label>Confirme a senha<input id="confirm" type="password" minlength="12" autocomplete="new-password" required></label><button id="submit">Criar conta</button></form>
<p id="msg" role="status"></p><a href="/login.html">Já tenho conta</a></main><script src="/cadastro.js"></script></html>
