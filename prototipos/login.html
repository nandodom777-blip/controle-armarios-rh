<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acesso | Controle de Armários RH</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b1423;color:#eaf1fa;font:16px system-ui;display:grid;place-items:center;padding:24px}.card{width:min(430px,100%);background:#17283b;border:1px solid #344b63;border-radius:18px;padding:32px}h1{font-size:25px}p{color:#afc3d7}label{display:block;margin-top:18px}input,button{width:100%;padding:13px;border-radius:9px;font:inherit}input{margin-top:6px;background:#0c2135;color:#fff;border:1px solid #456078}button{background:#5baaf7;color:#061529;border:0;margin-top:20px;cursor:pointer}.error{color:#ffa6a6}.ok{color:#89e0b7}</style></head><body><main class="card"><h1>Controle de Armários</h1><p>Acesso dos usuários autorizados</p><form id="login"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required minlength="8"><button>Entrar</button></form><p id="mensagem" role="status"></p><small>Esta é a prévia de interface. A conexão de autenticação e a autorização de perfis serão configuradas no servidor antes da publicação.</small></main><script>document.getElementById('login').addEventListener('submit',e=>{e.preventDefault();document.getElementById('mensagem').textContent='Prévia: autenticação ainda não ativada.'})</script></body></html>
